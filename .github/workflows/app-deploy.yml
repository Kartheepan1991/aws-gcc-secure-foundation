name: Application CI/CD Pipeline

# Trigger only on app changes, not infrastructure
on:
  push:
    branches: [main, develop]
    paths:
      - 'app/**'
      - '.github/workflows/app-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
  workflow_dispatch:

env:
  AWS_REGION: ap-southeast-1
  EKS_CLUSTER_NAME: dev-eks-cluster

permissions:
  id-token: write   # Required for OIDC
  contents: read
  pull-requests: write
  security-events: write

jobs:
  # ============================================
  # Phase 1: Security Scanning
  # ============================================
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner (Filesystem)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'sarif'
          output: 'trivy-fs-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        if: always()
        with:
          sarif_file: 'trivy-fs-results.sarif'

      - name: Run Trivy scan report
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: './app'
          format: 'table'
          output: 'trivy-scan-report.txt'

      - name: Upload scan report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: security-scan-report
          path: trivy-scan-report.txt

  # ============================================
  # Phase 2: Build and Test Application
  # ============================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Run npm audit
        working-directory: app
        run: npm audit --audit-level=moderate

      - name: Run tests
        working-directory: app
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: test-results
          path: app/coverage/

  # ============================================
  # Phase 3: Build Docker Image
  # ============================================
  build-docker-image:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [security-scan, build-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        working-directory: app
        run: |
          docker build -t ${{ env.EKS_CLUSTER_NAME }}-app:${{ github.sha }} .
          docker tag ${{ env.EKS_CLUSTER_NAME }}-app:${{ github.sha }} ${{ env.EKS_CLUSTER_NAME }}-app:latest

      - name: Run Trivy vulnerability scanner (Image)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.EKS_CLUSTER_NAME }}-app:${{ github.sha }}
          format: 'table'
          output: 'image-scan-report.txt'
          severity: 'CRITICAL,HIGH'

      - name: Upload image scan report
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: docker-image-scan
          path: image-scan-report.txt

      - name: Save Docker image
        run: |
          docker save ${{ env.EKS_CLUSTER_NAME }}-app:${{ github.sha }} | gzip > app-image.tar.gz

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v3
        with:
          name: docker-image
          path: app-image.tar.gz
          retention-days: 1

  # ============================================
  # Phase 4: Push to ECR
  # ============================================
  push-to-ecr:
    name: Push Image to ECR
    runs-on: ubuntu-latest
    needs: [build-docker-image]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      ecr_url: ${{ steps.get_ecr.outputs.ecr_url }}
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ECR repository URL
        id: get_ecr
        run: |
          ECR_URL=$(aws ecr describe-repositories --repository-names gcc-app --region ${{ env.AWS_REGION }} --query 'repositories[0].repositoryUri' --output text 2>/dev/null || echo "")
          if [ -z "$ECR_URL" ]; then
            echo "[ERROR] ECR repository not found. Deploy infrastructure first:"
            echo "  cd terraform/environments/dev && terraform apply"
            exit 1
          fi
          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "Found ECR: $ECR_URL"

      - name: Download Docker image artifact
        uses: actions/download-artifact@v3
        with:
          name: docker-image

      - name: Load Docker image
        run: |
          docker load < app-image.tar.gz

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and Push to ECR
        env:
          ECR_URL: ${{ steps.get_ecr.outputs.ecr_url }}
        run: |
          docker tag ${{ env.EKS_CLUSTER_NAME }}-app:${{ github.sha }} $ECR_URL:${{ github.sha }}
          docker tag ${{ env.EKS_CLUSTER_NAME }}-app:${{ github.sha }} $ECR_URL:latest
          docker push $ECR_URL:${{ github.sha }}
          docker push $ECR_URL:latest
          echo "Pushed image: $ECR_URL:${{ github.sha }}"

  # ============================================
  # Phase 5: Deploy to EKS
  # ============================================
  deploy-to-eks:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: [push-to-ecr]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify EKS cluster exists
        run: |
          if ! aws eks describe-cluster --name ${{ env.EKS_CLUSTER_NAME }} --region ${{ env.AWS_REGION }} &>/dev/null; then
            echo "[ERROR] EKS cluster '${{ env.EKS_CLUSTER_NAME }}' not found!"
            echo "Deploy infrastructure first: cd terraform/environments/dev && terraform apply"
            exit 1
          fi
          echo "EKS cluster found: ${{ env.EKS_CLUSTER_NAME }}"

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER_NAME }}
          kubectl cluster-info

      - name: Update image in manifests
        env:
          ECR_URL: ${{ needs.push-to-ecr.outputs.ecr_url }}
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$ECR_URL:${{ github.sha }}|g" app/k8s/deployment.yaml
          cat app/k8s/deployment.yaml | grep image:

      - name: Deploy to Kubernetes
        run: |
          kubectl apply -f app/k8s/serviceaccount.yaml
          kubectl apply -f app/k8s/deployment.yaml
          kubectl apply -f app/k8s/service.yaml
          kubectl apply -f app/k8s/ingress.yaml

      - name: Wait for deployment
        run: |
          kubectl rollout status deployment/gcc-app -n default --timeout=5m

      - name: Get deployment status
        run: |
          echo "=== Pods ==="
          kubectl get pods -n default
          echo ""
          echo "=== Services ==="
          kubectl get svc -n default
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress -n default
          echo ""
          echo "=== Application URL ==="
          kubectl get ingress gcc-app-ingress -n default -o jsonpath='{.status.loadBalancer.ingress[0].hostname}'

      - name: Deployment success
        run: |
          echo "=========================================="
          echo "[SUCCESS] Application deployed to EKS!"
          echo "=========================================="
          echo "Commit: ${{ github.sha }}"
          echo "Image: ${{ needs.push-to-ecr.outputs.ecr_url }}:${{ github.sha }}"
          echo ""
          echo "Test health endpoint:"
          echo "  kubectl port-forward svc/gcc-app-service 8080:80"
          echo "  curl http://localhost:8080/health"

  # ============================================
  # Phase 6: Generate Reports
  # ============================================
  generate-reports:
    name: Generate Deployment Report
    runs-on: ubuntu-latest
    needs: [deploy-to-eks]
    if: always()
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v3

      - name: Generate deployment summary
        run: |
          echo "# Application Deployment Report" > deployment-report.md
          echo "" >> deployment-report.md
          echo "**Date:** $(date -u)" >> deployment-report.md
          echo "**Commit:** ${{ github.sha }}" >> deployment-report.md
          echo "**Actor:** ${{ github.actor }}" >> deployment-report.md
          echo "**Branch:** ${{ github.ref_name }}" >> deployment-report.md
          echo "" >> deployment-report.md
          echo "## Deployment Pipeline:" >> deployment-report.md
          echo "✅ Security scanning completed" >> deployment-report.md
          echo "✅ Tests passed" >> deployment-report.md
          echo "✅ Docker image built and scanned" >> deployment-report.md
          echo "✅ Image pushed to ECR" >> deployment-report.md
          echo "✅ Application deployed to EKS" >> deployment-report.md
          echo "" >> deployment-report.md
          echo "## Artifacts Generated:" >> deployment-report.md
          ls -la
          cat deployment-report.md

      - name: Upload deployment report
        uses: actions/upload-artifact@v3
        with:
          name: deployment-report
          path: deployment-report.md
